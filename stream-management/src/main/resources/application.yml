# 自定义文档访问的地址，http://localhost:8080/sss
springdoc:
  swagger-ui:
    path: /stream-manage-api
  # 需要扫描的包路径
  packagesToScan: com.bbs.stream
  # 匹配的url路径
  pathsToMatch: /*

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.log4j2.Log4j2Impl

logging:
  level:
    com:
      baomidou: debug
      bbs:
        stream-manage: debug
        api: info
  file:
    path: logs/stream-manage/
  config: classpath:logback-spring.xml

