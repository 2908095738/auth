server:
  port: 8181
spring:
  application:
    name: store-manage
  main:
    allow-bean-definition-overriding: true
  boot:
    admin:
      client:
        url: http://192.168.0.100:7008
        instance:
          prefer-ip: true
  datasource:
    url: jdbc:mysql://47.105.39.255:13306/ml_store_manage?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    username: admin
    password: shenbimaliang
    addresses: 192.168.0.100:5672
    virtual-host: bthost
    connection-timeout: 15000
    listener:
      simple:
        concurrency: 5 #并发
        max-concurrency: 10 #最大并发
        prefetch: 1 #每次发送一条消息
        acknowledge-mode: manual #手动回复ack
  redis:
    host: 192.168.0.100
    port: 6379
    password: shenbimaliang
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
      resolve-lazily: false
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.log4j2.Log4j2Impl
logging:
  level:
    com.manage: debug
    com.baomidou: debug
  file:
    path: logs/
  config: classpath:logback-spring.xml
jwt:
  #  token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9
  name: token
  token: 123456
  expireTime: 7
apache:
  zookeeper:
    # 服务器连接地址，集群模式则使用逗号分隔如：ip1:host,ip2:host
    connect-url: 192.168.0.100:2181
    # 会话超时时间：单位ms
    session-timeout: 10000
    # 连接超时时间：单位ms
    connection-timeout: 10000
    # ACL权限控制，验证策略
    scheme: auth
    # 验证内容id
    auth_id: admin:123456
  # 重试策略
  retry-policy:
    # 初始化间隔时间
    base-sleep-time: 1000
    # 最大重试次数
    max-retries: 5
    # 最大重试间隔时间
    max-sleep: 30000
auth:
  host: 192.168.0.100:8515
  api:
    verify:
      path: /verify
      token: authorization
      timeout: 10000
    search:
      id: /server/
      list: /server/list

# Spring Admin 开启监控所有项
management:
  endpoints:
    web:
      exposure:
        include: "*"