spring.application.name=auth
spring.profiles.active=dev
server.port=9999

# see https://nacos.io/zh-cn/docs/quick-start-spring-cloud.html
spring.cloud.nacos.config.server-addr=192.168.0.100:8848
spring.cloud.nacos.config.username=nacos
spring.cloud.nacos.config.password=nacos

spring.cloud.nacos.config.namespace=0b09ef92-7162-4669-8c0c-cac022c707ae
spring.cloud.nacos.config.group=DEFAULT_GROUP
spring.cloud.nacos.config.file-extension=yaml



spring.cloud.nacos.discovery.server-addr=192.168.0.100:8848
spring.cloud.nacos.discovery.username=nacos
spring.cloud.nacos.discovery.password=nacos
spring.cloud.nacos.discovery.service=auth

spring.cloud.nacos.discovery.namespace=0b09ef92-7162-4669-8c0c-cac022c707ae
spring.cloud.nacos.discovery.group=DEFAULT_GROUP



apache.zookeeper.connect-url=192.168.0.100:2181
apache.zookeeper.session-timeout=10000
apache.zookeeper.connection-timeout=10000
apache.zookeeper.scheme=auth
apache.zookeeper.auth_id=admin:123456
apache.retry-policy.base-sleep-time=1000
apache.retry-policy.max-retries=5
apache.retry-policy.max-sleep=30000